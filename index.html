<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#171717" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Offline Manga & Light Novel Reader" />
  <title>Manga & LN Reader</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preload" href="style/output.css" as="style" />
  <link rel="stylesheet" href="style/output.css" />
</head>

<body
  class="bg-mono-black text-mono-light font-sans min-h-screen antialiased selection:bg-mono-light selection:text-mono-black">
  <!-- Home-->
  <main id="homeView" class="max-w-6xl mx-auto px-3 sm:px-8 pt-6 sm:pt-16 pb-8">
    <div class="flex items-center gap-2 sm:gap-3 w-full mb-6 sm:mb-10">
      <div class="relative flex-1 min-w-0 h-10">
        <i data-lucide="search"
          class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-mono-light/50 pointer-events-none"></i>
        <input type="text" id="searchInput" oninput="renderHome()" placeholder="Search..." aria-label="Search title"
          class="w-full h-full bg-mono-dark/20 border border-mono-dark/60 pl-9 pr-3 rounded-lg text-xs sm:text-sm font-medium text-mono-light placeholder:text-mono-light/40 focus:outline-none focus:border-mono-light transition-all" />
      </div>

      <div class="relative h-10 shrink-0">
        <select id="filterType" onchange="renderHome()" aria-label="Filter by type"
          class="h-full bg-mono-dark/40 hover:bg-mono-dark/70 border border-mono-dark/60 text-mono-light text-xs sm:text-sm font-semibold rounded-lg pl-3 pr-7 focus:outline-none focus:border-mono-light transition-all appearance-none cursor-pointer">
          <option value="All" class="bg-mono-black text-mono-light">All</option>
          <option value="Light Novel" class="bg-mono-black text-mono-light">LN</option>
          <option value="Manga" class="bg-mono-black text-mono-light">Manga</option>
        </select>
        <i data-lucide="chevron-down"
          class="w-3.5 h-3.5 absolute right-2 top-1/2 -translate-y-1/2 text-mono-light/50 pointer-events-none"></i>
      </div>

      <button id="btnOpenHistory" aria-label="Open Reading History"
        class="w-10 h-10 bg-mono-dark/40 hover:bg-mono-dark/70 rounded-lg border border-mono-dark/60 transition-all flex justify-center items-center shrink-0"
        title="History">
        <i data-lucide="history" class="w-4 h-4 text-mono-light/80"></i>
      </button>

      <button id="btnOpenModal" aria-label="Add New Title"
        class="w-10 h-10 bg-mono-light hover:bg-white text-mono-black rounded-lg transition-all flex justify-center items-center shrink-0 shadow-sm"
        title="Add Title">
        <i data-lucide="plus" class="w-5 h-5 font-bold"></i>
      </button>
    </div>

    <div id="seriesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-5"></div>
    </div>

    <!-- Detail -->
    <div id="detailView" style="display: none" class="min-h-screen pb-10">
      <header
        class="sticky top-0 z-40 bg-mono-black/90 backdrop-blur-md px-4 sm:px-8 py-4 flex items-center justify-between">
        <button id="btnBackToHome"
          class="text-mono-light hover:text-white flex items-center gap-2 text-sm font-bold transition-colors">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </button>
      </header>

      <div class="max-w-2xl mx-auto px-4 pt-2 pb-8 flex flex-col items-center text-center">
        <div id="detailCoverContainer"
          class="w-44 h-64 sm:w-56 sm:h-80 rounded-2xl overflow-hidden shadow-2xl mb-5 border border-mono-dark/30">
        </div>

        <!-- Judul -->
        <h2 id="detailTitle" class="text-2xl sm:text-3xl font-bold text-white tracking-tight mb-3">Series Title</h2>

        <div class="flex items-center gap-2 mb-6">
          <span id="detailBadge"
            class="bg-mono-dark/40 text-mono-light border border-mono-dark/80 font-bold text-[10px] px-2.5 py-0.5 rounded-md uppercase tracking-wider">Manga</span>
          <span class="text-mono-dark/60 text-xs font-bold">•</span>
          <p id="detailCount" class="text-xs font-semibold text-mono-light/70">0 Volume</p>
        </div>

        <!-- Upload & Edit button -->
        <div class="flex justify-center gap-3 w-full max-w-xs">
          <input type="file" id="chapterFileInput" accept=".cbz,.zip,.epub" multiple hidden />
          <button id="btnUploadChapter"
            class="flex-1 bg-mono-light hover:bg-white text-mono-black font-bold py-2.5 rounded-lg transition-all flex justify-center items-center gap-2 text-xs">
            <i data-lucide="upload-cloud" class="w-4 h-4"></i> Upload
          </button>

          <button id="btnOpenEditModal"
            class="flex-1 bg-mono-dark/30 hover:bg-mono-dark/50 text-mono-light font-semibold py-2.5 rounded-lg border border-mono-dark/60 transition-all flex justify-center items-center gap-2 text-xs">
            <i data-lucide="pencil" class="w-4 h-4 text-mono-light/70"></i> Edit
          </button>
        </div>
      </div>

      <div class="max-w-4xl mx-auto px-4 sm:px-8">
        <div class="w-full h-px bg-mono-dark/30 mb-6"></div>

        <h3 id="chapterSectionTitle" class="text-lg font-bold text-white tracking-tight mb-4"></h3>
        <div id="chapterList" class="flex flex-col gap-2.5"></div>
      </div>
    </div>

    <!-- Reader page -->
    <div id="readerView" style="display: none" class="min-h-screen bg-[#121214]">
      <header
        class="sticky top-0 z-40 bg-[#18181B] border-b border-[#27272A] px-2 sm:px-4 py-3 flex justify-between items-center">
        <button id="btnBackToDetail"
          class="bg-[#27272A] hover:bg-[#3F3F46] text-zinc-300 font-medium px-2.5 sm:px-3 py-1.5 rounded-lg border border-[#3F3F46] transition-all text-xs flex items-center gap-1.5">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Back</span>
        </button>

        <div class="flex items-center gap-1 sm:gap-3">
          <button id="btnPrevChapter"
            class="bg-[#27272A] hover:bg-[#3F3F46] text-zinc-300 font-medium px-2 sm:px-3 py-1.5 rounded-lg border border-[#3F3F46] transition-all text-xs flex items-center gap-1">
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
            <span class="hidden sm:inline">Prev</span>
          </button>
          <span id="readerTitleDisplay"
            class="font-bold text-[11px] sm:text-sm text-mono-light tracking-wide min-w-[50px] text-center"></span>
          <button id="btnNextChapter"
            class="bg-[#27272A] hover:bg-[#3F3F46] text-zinc-300 font-medium px-2 sm:px-3 py-1.5 rounded-lg border border-[#3F3F46] transition-all text-xs flex items-center gap-1">
            <span class="hidden sm:inline">Next</span>
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
        </div>
      </header>

      <main class="max-w-4xl mx-auto px-2 sm:px-4 py-6 sm:py-8">
        <div id="viewer" class="min-h-[500px]"></div>
      </main>
    </div>

    <!-- Add New Title -->
    <div id="modalOverlay" style="display: none"
      class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex justify-center items-center p-4">
      <div class="bg-mono-black border border-mono-dark rounded-xl p-5 sm:p-6 w-full max-w-md shadow-2xl">
        <h3
          class="text-base sm:text-lg font-bold text-white mb-4 flex items-center gap-2 border-b border-mono-dark/60 pb-3">
          <i data-lucide="plus-circle" class="w-5 h-5 text-mono-light"></i>New Title
        </h3>

        <div class="flex flex-col gap-3">
          <div>
            <label class="text-xs font-semibold text-mono-light/60 block mb-1">Title:</label>
            <input type="text" id="inputTitle" placeholder="Title..."
              class="w-full bg-mono-dark/20 border border-mono-dark/60 rounded-lg p-2.5 text-sm text-mono-light focus:border-mono-light focus:outline-none" />
          </div>

          <div>
            <label class="text-xs font-semibold text-mono-light/60 block mb-1">Type:</label>
            <select id="inputType" aria-label="Select Series Type"
              class="w-full bg-mono-dark/20 border border-mono-dark/60 rounded-lg p-2.5 text-sm text-mono-light focus:border-mono-light focus:outline-none">
              <option value="Light Novel" class="bg-mono-black text-mono-light">Light Novel</option>
              <option value="Manga" class="bg-mono-black text-mono-light">Manga</option>
            </select>
          </div>

          <div>
            <label class="text-xs font-semibold text-mono-light/60 block mb-1">Cover</label>
            <input type="file" id="inputCoverFile" accept="image/*" aria-label="Upload Cover Image"
              class="w-full text-xs bg-mono-dark/20 border border-mono-dark/60 rounded-lg p-2 text-mono-light/60" />
          </div>

          <div>
            <label class="text-xs font-semibold text-mono-light/60 block mb-1">Upload</label>
            <input type="file" id="inputChapterFiles" accept=".cbz,.zip,.epub" multiple
              aria-label="Upload Chapter Files"
              class="w-full text-xs bg-mono-dark/20 border border-mono-dark/60 rounded-lg p-2 text-mono-light/60" />
          </div>
        </div>

        <div class="flex justify-end gap-2.5 mt-5 sm:mt-6 border-t border-mono-dark/60 pt-4">
          <button id="btnCancelModal" aria-label="Cancel Add Series"
            class="bg-mono-dark/40 hover:bg-mono-dark/70 text-mono-light font-semibold px-4 py-2 rounded-lg border border-mono-dark/60 text-xs">
            Cancel
          </button>
          <button id="btnSaveSeries"
            class="bg-mono-light hover:bg-white text-mono-black font-bold px-4 py-2 rounded-lg text-xs">
            Save
          </button>
        </div>
      </div>
    </div>

    <!-- Edit & Delete -->
    <div id="editModalOverlay" style="display: none"
      class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex justify-center items-center p-4">
      <div class="bg-mono-black border border-mono-dark rounded-xl p-5 sm:p-6 w-full max-w-md shadow-2xl">
        <h3
          class="text-base sm:text-lg font-bold text-white mb-4 flex items-center gap-2 border-b border-mono-dark/60 pb-3">
          <i data-lucide="pencil" class="w-5 h-5 text-mono-light"></i> Edit Series
        </h3>

        <div class="flex flex-col gap-3">
          <div>
            <label class="text-xs font-semibold text-mono-light/60 block mb-1">Title:</label>
            <input type="text" id="editTitleInput"
              class="w-full bg-mono-dark/20 border border-mono-dark/60 rounded-lg p-2.5 text-sm text-mono-light focus:border-mono-light focus:outline-none" />
          </div>

          <div>
            <label class="text-xs font-semibold text-mono-light/60 block mb-1">Type:</label>
            <select id="editTypeInput"
              class="w-full bg-mono-dark/20 border border-mono-dark/60 rounded-lg p-2.5 text-sm text-mono-light focus:border-mono-light focus:outline-none">
              <option value="Light Novel" class="bg-mono-black text-mono-light">Light Novel</option>
              <option value="Manga" class="bg-mono-black text-mono-light">Manga</option>
            </select>
          </div>

          <div>
            <label class="text-xs font-semibold text-mono-light/60 block mb-1">Cover</label>
            <input type="file" id="editCoverFileInput" accept="image/*"
              class="w-full text-xs bg-mono-dark/20 border border-mono-dark/60 rounded-lg p-2 text-mono-light/60" />
          </div>
        </div>

        <div class="flex justify-between items-center mt-5 sm:mt-6 border-t border-mono-dark/60 pt-4">
          <button id="btnDeleteSeries"
            class="bg-mono-dark/30 hover:bg-red-950/50 text-mono-light/70 hover:text-red-400 font-semibold px-3 py-2 rounded-lg border border-mono-dark/60 hover:border-red-500/50 text-xs flex items-center gap-1.5 transition-all">
            <i data-lucide="trash-2" class="w-4 h-4"></i> Delete
          </button>
          <div class="flex gap-2">
            <button id="btnCancelEditModal" aria-label="Cancel Edit Series"
              class="bg-mono-dark/40 hover:bg-mono-dark/70 text-mono-light font-semibold px-3.5 py-2 rounded-lg border border-mono-dark/60 text-xs">
              Cancel
            </button>
            <button id="btnSaveEditSeries"
              class="bg-mono-light hover:bg-white text-mono-black font-bold px-3.5 py-2 rounded-lg text-xs">
              Save
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Reading Hostory -->
    <div id="historyModalOverlay" style="display: none"
      class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex justify-center items-center p-4">
      <div class="bg-mono-black border border-mono-dark rounded-xl p-5 sm:p-6 w-full max-w-lg shadow-2xl">
        <div class="flex justify-between items-center mb-4 border-b border-mono-dark/60 pb-3">
          <h3 class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
            <i data-lucide="history" class="w-5 h-5 text-mono-light"></i>History
          </h3>
          <button id="btnClearHistory" aria-label="Clear All History"
            class="bg-mono-dark/30 hover:bg-red-950/50 text-mono-light/70 hover:text-red-400 font-semibold px-2.5 py-1 rounded-md border border-mono-dark/60 hover:border-red-500/50 text-[11px] sm:text-xs transition-all">
            Clear History
          </button>
        </div>

        <div id="historyList" class="flex flex-col gap-2 max-h-[60vh] sm:max-h-80 overflow-y-auto pr-1"></div>

        <div class="flex justify-end mt-4 pt-3 border-t border-mono-dark/60">
          <button id="btnCloseHistoryModal" <button id="btnCloseHistoryModal" aria-label="Close History Modal"
            class="bg-mono-dark/40 hover:bg-mono-dark/70 text-mono-light font-semibold px-4 py-2 rounded-lg border border-mono-dark/60 text-xs">
            Close
          </button>
        </div>
      </div>
    </div>

    <!-- Custom Confirm -->
    <div id="confirmModalOverlay" style="display: none"
      class="fixed inset-0 bg-black/75 backdrop-blur-sm z-[60] flex justify-center items-center p-4">
      <div
        class="bg-mono-black border border-mono-dark rounded-xl p-5 sm:p-6 w-full max-w-sm shadow-2xl text-center sm:text-left">
        <h3 class="text-lg font-bold text-white mb-2 flex justify-center sm:justify-start items-center gap-2">
          <i data-lucide="alert-triangle" class="w-5 h-5 text-red-400"></i>
          <span id="confirmTitleText">Confirm Action</span>
        </h3>
        <p id="confirmMessage" class="text-sm text-mono-light/80 mb-6">Are you sure?</p>

        <div class="flex justify-center sm:justify-end gap-2.5">
          <button id="btnCancelConfirm" aria-label="Cancel Delete"
            class="bg-mono-dark/40 hover:bg-mono-dark/70 text-mono-light font-semibold px-4 py-2 rounded-lg border border-mono-dark/60 text-xs transition-all w-full sm:w-auto">
            Cancel
          </button>
          <button id="btnOkConfirm" aria-label="Confirm Delete"
            class="bg-red-500/10 hover:bg-red-500/20 text-red-400 font-semibold px-4 py-2 rounded-lg border border-red-500/30 text-xs transition-all w-full sm:w-auto">
            Yes, Delete
          </button>
        </div>
      </div>
    </div>

    <script defer src="js/lucide.min.js"></script>
    <script defer src="js/db.js"></script>
    <script defer src="js/parser.js"></script>
    <script defer src="js/ui.js"></script>
    <script defer src="js/app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/book/sw.js')
            .then(reg => console.log('Service Worker terdaftar!', reg))
            .catch(err => console.log('Gagal daftar SW:', err));
        });
      }
    </script>
</body>

</html>
